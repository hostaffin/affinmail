# AffinMail Production Multi-Arch Docker Compose Stack
# Supported CPU Architectures: linux/amd64 (x86_64), linux/arm64 (aarch64)

version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
      - "2087:2087"   # AffinMail Admin Panel (API Automatable)
      - "2083:2083"   # AffinMail User Panel / Webmail (MCP Automatable)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../webmail/dist:/var/www/affinmail-web/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - affinmail-net
    depends_on:
      - stalwart

  stalwart:
    image: stalwartlabs/mail-server:latest
    restart: unless-stopped
    ports:
      - "25:25"       # Inbound SMTP
      - "465:465"     # Implicit TLS SMTP Submission
      - "587:587"     # STARTTLS SMTP Submission
      - "993:993"     # IMAP4rev2 over TLS
      - "4190:4190"   # ManageSieve
    environment:
      - STALWART_DB_HOST=postgres
      - STALWART_DB_PORT=5432
      - STALWART_DB_NAME=affinmail
      - STALWART_DB_USER=affinmail_user
      - STALWART_DB_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeSecurePass2026!}
      - STALWART_REDIS_URL=redis://:${REDIS_PASSWORD:-ChangeMeRedisPass2026!}@redis:6379
      # Dynamic Storage Backend Configuration (fs | s3 | sftp)
      - STORAGE_BLOB_TYPE=${STORAGE_BLOB_TYPE:-fs}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - SFTP_HOST=${SFTP_HOST:-}
      - SFTP_USER=${SFTP_USER:-}
      - SFTP_PORT=${SFTP_PORT:-22}
    volumes:
      - ./stalwart.toml:/opt/stalwart/etc/config.toml:ro
      - ${STORAGE_LOCAL_PATH:-stalwart_blobs}:/var/lib/stalwart/blobs
      - stalwart_data:/opt/stalwart/data
    networks:
      - affinmail-net
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: affinmail
      POSTGRES_USER: affinmail_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePass2026!}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../sql/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ../sql/002_seed_demo_data.sql:/docker-entrypoint-initdb.d/002_seed_demo_data.sql:ro
    networks:
      - affinmail-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ChangeMeRedisPass2026!}"]
    volumes:
      - redis_data:/data
    networks:
      - affinmail-net

networks:
  affinmail-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  stalwart_blobs:
  stalwart_data:
  pg_data:
  redis_data:
