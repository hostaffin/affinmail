[package]
name = "affinmail-mcp-server"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol (MCP) Server for AffinMail User Panel Automation"
authors = ["AffinMail Engineering <dev@hostaffin.com>"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
